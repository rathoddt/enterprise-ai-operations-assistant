
services:
  eaoa-postgres:
    image: postgres:17
    container_name: eaoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eaoa_analytics
      POSTGRES_USER: eaoa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eaoa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaoa_app -d eaoa_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eaoa_postgres_data:
